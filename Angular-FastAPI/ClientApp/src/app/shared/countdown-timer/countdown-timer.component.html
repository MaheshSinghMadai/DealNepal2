<span class="timer-minimal-text font-mono" [class.expired]="isExpired">
  <ng-container *ngIf="!isExpired">
    <span *ngIf="days > 0">{{ days }}d </span>{{ hours | number:'2.0-0' }}:{{ minutes | number:'2.0-0' }}:{{ seconds | number:'2.0-0' }}
  </ng-container>
  <span *ngIf="isExpired" class="expired-text">CLOSED</span>
</span>
