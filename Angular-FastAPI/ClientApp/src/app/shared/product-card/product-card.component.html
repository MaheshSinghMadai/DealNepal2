<div class="product-minimal-card glass-panel" *ngIf="product">
  
  <!-- Media Header Wrap with Overlay Badges -->
  <div class="card-media-wrapper">
    <a [routerLink]="['/product', product.productID]" class="media-link">
      <img 
        [src]="product.productImageName || getCategoryImage(product.category)" 
        [alt]="product.productName" 
        class="card-product-img" 
      />
      <div class="image-gradient-overlay"></div>
    </a>
    
    <!-- Top Right Countdown Timer Pill -->
    <div class="card-timer-floating-box">
      <mat-icon class="timer-icon">schedule</mat-icon>
      <app-countdown-timer [endTime]="product.endTime"></app-countdown-timer>
    </div>

    <!-- Category Pill Badge Top Left -->
    <div class="card-category-badge">
      <span>{{ product.category }}</span>
    </div>
  </div>

  <!-- Card Body Content -->
  <div class="card-body-content">
    <div class="lot-meta-bar">
      <span class="lot-number-tag font-mono">LOT #NP-{{ product.productID }}</span>
      <span class="seller-tag">&#64;{{ product.userName || 'Curator' }}</span>
    </div>

    <h3 class="card-title font-serif">
      <a [routerLink]="['/product', product.productID]">{{ product.productName }}</a>
    </h3>

    <!-- Pricing Row -->
    <div class="pricing-spotlight-row">
      <div class="price-col">
        <span class="price-label">Current Bid</span>
        <div class="current-price-val font-mono">NPR {{ product.latestBid | number }}</div>
      </div>
      <div class="reserve-col text-right">
        <span class="price-label">Reserve</span>
        <div class="reserve-val font-mono">NPR {{ product.minPrice | number }}</div>
      </div>
    </div>

    <!-- Action Footer CTA -->
    <div class="card-action-wrap">
      <a [routerLink]="['/product', product.productID]" class="bid-btn-minimal">
        <span>PLACE BID</span>
        <mat-icon class="btn-arrow-icon">arrow_forward</mat-icon>
      </a>
    </div>
  </div>

</div>
