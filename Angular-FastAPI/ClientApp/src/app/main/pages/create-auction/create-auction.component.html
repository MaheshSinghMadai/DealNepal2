<div class="main-content">
  <div class="app-container max-w-3xl">
    
    <div class="form-container-card glass-panel">
      
      <div class="form-header">
        <span class="header-sub-tag font-mono">SELLER CONCIERGE</span>
        <h1 class="form-title font-serif">POST NEW AUCTION LOT</h1>
        <p class="form-subtitle">List your Thangka art, historical coins, royal jewellery or fine antiques for live bidding across Nepal.</p>
      </div>

      <form (ngSubmit)="onSubmit()" #auctionForm="ngForm" class="create-form">
        
        <!-- Product Name -->
        <div class="form-group">
          <label class="form-label font-mono text-xs text-subtle">TITLE / ITEM NAME *</label>
          <input 
            type="text" 
            class="input-minimal" 
            placeholder="e.g. 18th Century Gold Leaf Thangka Mandala" 
            [(ngModel)]="productName" 
            name="productName" 
            required 
          />
        </div>

        <!-- Category & Image URL -->
        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label font-mono text-xs text-subtle">CATEGORY DEPARTMENT *</label>
            <select class="input-minimal" [(ngModel)]="category" name="category" required>
              <option value="Coins">Coins</option>
              <option value="Furniture">Furniture</option>
              <option value="Jewellery">Jewellery</option>
              <option value="Art">Art</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label font-mono text-xs text-subtle">IMAGE ASSET URL *</label>
            <input 
              type="text" 
              class="input-minimal" 
              placeholder="https://images.unsplash.com/..." 
              [(ngModel)]="productImageName" 
              name="productImageName" 
              required 
            />
          </div>
        </div>

        <!-- Live Image Preview -->
        <div *ngIf="productImageName" class="image-preview-box">
          <span class="preview-label font-mono text-xs text-subtle">IMAGE PREVIEW:</span>
          <div class="preview-img-wrap">
            <img [src]="productImageName" alt="Preview" class="preview-img" (error)="onImageError()" />
          </div>
        </div>

        <!-- Description -->
        <div class="form-group">
          <label class="form-label font-mono text-xs text-subtle">DETAILED DESCRIPTION & PROVENANCE *</label>
          <textarea 
            class="input-minimal textarea-input" 
            rows="4" 
            placeholder="Describe provenance, dimensions, materials, and historical significance..." 
            [(ngModel)]="description" 
            name="description" 
            required
          ></textarea>
        </div>

        <!-- Pricing Grid -->
        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label font-mono text-xs text-subtle">MINIMUM STARTING BID (NPR) *</label>
            <input 
              type="number" 
              class="input-minimal font-mono" 
              placeholder="10000" 
              [(ngModel)]="minPrice" 
              name="minPrice" 
              required 
            />
          </div>

          <div class="form-group">
            <label class="form-label font-mono text-xs text-subtle">MAX ESTIMATE PRICE (NPR)</label>
            <input 
              type="number" 
              class="input-minimal font-mono" 
              placeholder="50000" 
              [(ngModel)]="maxPrice" 
              name="maxPrice" 
            />
          </div>
        </div>

        <!-- Duration Selection -->
        <div class="form-group">
          <label class="form-label font-mono text-xs text-subtle">AUCTION DURATION</label>
          <select class="input-minimal" [(ngModel)]="durationDays" name="durationDays">
            <option [value]="3">3 Days (Fast Auction)</option>
            <option [value]="5">5 Days</option>
            <option [value]="7">7 Days (Standard)</option>
            <option [value]="14">14 Days (Extended)</option>
          </select>
        </div>

        <!-- Action Footer -->
        <div class="form-actions-bar">
          <button type="button" class="btn-outline-minimal" (click)="cancel()">CANCEL</button>
          <button type="submit" class="btn-gold-minimal" [disabled]="!auctionForm.valid">
            <mat-icon>cloud_upload</mat-icon>
            <span>PUBLISH AUCTION LOT</span>
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
